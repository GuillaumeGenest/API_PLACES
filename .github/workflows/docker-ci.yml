name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13.2'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run unit tests
        run: pytest tests/unit/
        env:
          ENVIRONMENT: testing
          TESTING: "true"  
          GOOGLE_API_KEY_TEST: ${{ secrets.GOOGLE_API_KEY_TEST }}
          OPENAI_API_KEY_TEST: ${{ secrets.OPENAI_API_KEY_TEST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_TEST }}
          SERVER_BASE_URL_TEST: "http://localhost"
          SUPABASE_BASE_URL_TEST: "https://test.supabase.co"
          SUPABASE_API_KEY_TEST: "test_key"

  build-and-push:
    needs: unit-tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    concurrency:
      group: docker-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build Docker image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$owner/places-api:${{ github.ref_name }} -t ghcr.io/$owner/places-api:latest .
      - name: Push Docker image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/$owner/places-api:${{ github.ref_name }}
          docker push ghcr.io/$owner/places-api:latest